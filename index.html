function drawBall(px,py,r,rot){
 x.save();x.translate(px,py);
 const g=x.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#c4c9d0');
 x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();
 x.clip();x.rotate(rot);x.fillStyle='#1b1f27';
 const pent=(cx,cy,s)=>{x.beginPath();for(let i=0;i<5;i++){const a=i*Math.PI*.4-Math.PI/2;x.lineTo(cx+Math.cos(a)*s,cy+Math.sin(a)*s)}x.closePath();x.fill()};
 pent(0,0,r*.38);for(let i=0;i<5;i++){const a=i*Math.PI*.4-Math.PI/2;pent(Math.cos(a)*r*.95,Math.sin(a)*r*.95,r*.3)}
 x.restore();x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1;x.beginPath();x.arc(px,py,r,0,7);x.stroke();
}

function disp(px,py,now){if(!ripple)return 0;const age=(now-ripple.s)/1000;if(age>1.6)return 0;
 const d=Math.hypot(px-ripple.x,py-ripple.y);return Math.sin(d*.12-age*14)*14*Math.exp(-d/70)*Math.exp(-age*2.2)}
function drawNet(now){
 x.fillStyle='rgba(8,14,10,.55)';x.fillRect(GX0,GY0,GX1-GX0,GY1-GY0);
 x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=1;
 for(let i=GX0;i<=GX1;i+=14){x.beginPath();for(let j=GY0;j<=GY1;j+=10){const d=disp(i,j,now);j===GY0?x.moveTo(i+d*.5,j+d):x.lineTo(i+d*.5,j+d)}x.stroke()}
 for(let j=GY0;j<=GY1;j+=14){x.beginPath();for(let i=GX0;i<=GX1;i+=10){const d=disp(i,j,now);i===GX0?x.moveTo(i+d*.5,j+d):x.lineTo(i+d*.5,j+d)}x.stroke()}
}

 const post=((Math.abs(tx-GX0)<10||Math.abs(tx-GX1)<10)&&ty>GY0-10&&ty<GY1)||(Math.abs(ty-GY0)<10&&tx>GX0-10&&tx<GX1+10);
 const reach=ty<GY0+22?15:24;let r,goal=false;
 if(inX&&inY&&Math.abs(tx-kx)<reach){r='SAVED!';ball.res='save';ball.vx=(tx-kx)*.18+(Math.random()-.5)*3;ball.vy=3;tone(120,.25,'square',.2,60)}
 else if(post){r='HIT THE POST!';ball.res='post';ball.vx=(tx<180?-1:1)*2;ball.vy=3;shake=10;tone(900,.3,'triangle',.3,400)}
 else if(!inX||!inY){r='MISSED!';ball.res='miss';ball.vx=(tx-180)*.03;ball.vy=-2.5;tone(160,.4,'sawtooth',.12,70)}
 else{r='GOAL!';goal=true;ball.res='goal';ripple={x:tx,y:ty,s:performance.now()};shake=6;tone(520,.15,'square',.15);setTimeout(()=>tone(780,.3,'square',.15),130);
  for(let i=0;i<70;i++)parts.push({x:180,y:250,vx:(Math.random()-.5)*9,vy:-Math.random()*9-2,c:`hsl(${Math.random()*360},90%,60%)`,l:1})}
 shots.push(goal);msg=r;tmsg=performance.now();state='res';
 setTimeout(()=>{if(shots.length>=TOT){state='over';if(shots.filter(Boolean).length>=3){for(let i=0;i<90;i++)parts.push({x:180,y:200,vx:(Math.random()-.5)*11,vy:-Math.random()*10-2,c:`hsl(${Math.random()*360},90%,60%)`,l:1})}}
  else{state='aim';ball=null;dive=null;kx=180;bp={x:BX,y:BY,r:14,rot:0}}},1500);
}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*360/r.width,y:(e.clientY-r.top)*560/r.height}}
c.addEventListener('pointerdown',e=>{
 if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}
 if(state==='start'){state='aim';return}
 if(state==='over'){shots=[];state='aim';ball=null;dive=null;kx=180;bp={x:BX,y:BY,r:14,rot:0};return}
 if(state==='aim'){down=true;const p=pos(e);aim.x=clamp(p.x,GX0+8,GX1-8);aim.y=clamp(p.y,GY0+8,GY1-8)}
});
c.addEventListener('pointermove',e=>{if(state==='aim'){const p=pos(e);if(down||e.pointerType==='mouse'){aim.x=clamp(p.x,GX0+8,GX1-8);aim.y=clamp(p.y,GY0+8,GY1-8)}}});
addEventListener('pointerup',()=>{if(down){down=false;shoot()}});
function text(t,px,py,size,fill,stroke){x.font=`900 ${size}px system-ui,sans-serif`;x.textAlign='center';x.lineJoin='round';
 if(stroke){x.lineWidth=size/6;x.strokeStyle=stroke;x.strokeText(t,px,py)}x.fillStyle=fill;x.fillText(t,px,py)}
// ---------- main loop ----------
function draw(now){
 x.setTransform(S,0,0,S,0,0);
 x.drawImage(bg,0,0,360,560);
 x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.3)shake=0}
 drawNet(now);
 // posts
 x.lineCap='round';x.lineJoin='round';
 x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=10;x.beginPath();x.moveTo(GX0+2,GY1+8);x.lineTo(GX0+2,GY0+2);x.lineTo(GX1+2,GY0+2);x.lineTo(GX1+2,GY1+8);x.stroke();
 x.strokeStyle='#f4f6f8';x.lineWidth=7;x.beginPath();x.moveTo(GX0,GY1+6);x.lineTo(GX0,GY0);x.lineTo(GX1,GY0);x.lineTo(GX1,GY1+6);x.stroke();
 // keeper
 let tilt=0,lift=0;
 if(state==='aim'||state==='start'){kx=180+Math.sin(now/750)*45}
 else if(dive&&now>dive.s){const p=Math.min(1,(now-dive.s)/520),e=ease(p);kx=dive.from+(dive.to-dive.from)*e;tilt=(dive.to-dive.from)/150*1.15*e;lift=Math.sin(p*Math.PI)*18}
 const kh=152,kw=img.naturalWidth?kh*img.naturalWidth/img.naturalHeight:58;
 x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(kx,GY1+8,kw*.4,6,0,0,7);x.fill();
 if(img.complete&&img.naturalWidth){x.save();x.translate(kx,GY1+6-kh/2-lift);x.rotate(tilt);x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=8;x.drawImage(img,-kw/2,-kh/2,kw,kh);x.restore()}
 // ball
 if(state==='fly'||state==='res'){
  const b=ball;
  if(state==='fly'||!b.res){const p=Math.min(1,(now-b.s)/520),e=ease(p);
   bp.x=BX+(b.tx-BX)*e;bp.y=BY+(b.ty-BY)*e-Math.sin(p*Math.PI)*26;bp.r=14-7*e;bp.rot+=.35;
   x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(bp.x,BY+(GY1+10-BY)*e,bp.r,bp.r*.35,0,0,7);x.fill();
   if(p>=1&&state==='fly')resolve()}
  else if(b.res==='save'||b.res==='post'||b.res==='miss'){bp.x+=b.vx;bp.y+=b.vy;b.vy+=b.res==='miss'?0:.35;bp.rot+=.3;if(b.res==='miss')bp.r=Math.max(3,bp.r-.05);if(bp.y>GY1+70){bp.y=GY1+70;b.vy*=-.4;b.vx*=.85}}
  else if(b.res==='goal'){bp.y=Math.min(bp.y+.15,b.ty+6);bp.rot+=.02}
  drawBall(bp.x,bp.y,bp.r,bp.rot);
 }else{
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(BX,BY+13,15,5,0,0,7);x.fill();drawBall(BX,BY,14,0);
 }
 // aim
 if(state==='aim'){
  const pulse=1+Math.sin(now/180)*.12;
  x.strokeStyle='#ffd23f';x.lineWidth=2.5;x.setLineDash([6,5]);x.beginPath();x.moveTo(BX,BY-18);x.lineTo(aim.x,aim.y);x.stroke();x.setLineDash([]);
  x.beginPath();x.arc(aim.x,aim.y,15*pulse,0,7);x.stroke();
  x.beginPath();x.moveTo(aim.x-22,aim.y);x.lineTo(aim.x-8,aim.y);x.moveTo(aim.x+8,aim.y);x.lineTo(aim.x+22,aim.y);x.moveTo(aim.x,aim.y-22);x.lineTo(aim.x,aim.y-8);x.moveTo(aim.x,aim.y+8);x.lineTo(aim.x,aim.y+22);x.stroke();
  text('Drag on the goal, release to shoot',180,528,15,'#fff','rgba(0,0,0,.6)');
 }
 x.restore();
 // particles
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l-=.011;x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.fillRect(p.x,p.y,6,4)}
 x.globalAlpha=1;parts=parts.filter(p=>p.l>0);
 // HUD
 const hg=x.createLinearGradient(0,0,0,50);hg.addColorStop(0,'rgba(0,0,0,.75)');hg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=hg;x.fillRect(0,0,360,50);
 x.textAlign='left';x.font='900 17px system-ui';x.fillStyle='#fff';x.fillText('⚽ '+shots.filter(Boolean).length+' / '+TOT,14,30);
 for(let i=0;i<TOT;i++){x.beginPath();x.arc(238+i*25,26,8.5,0,7);x.fillStyle=i<shots.length?(shots[i]?'#3ddc5a':'#ef4444'):'rgba(255,255,255,.25)';x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke()}
 // messages
 if(state==='res'){const a=Math.min(1,(now-tmsg)/180),s=.6+.4*ease(a);x.save();x.translate(180,318);x.scale(s,s);
  text(msg,0,0,msg.length>8?34:46,msg==='GOAL!'?'#3ddc5a':'#ffd23f','#000');x.restore()}
 if(state==='start'||state==='over'){
  x.fillStyle='rgba(0,0,0,.72)';x.fillRect(0,0,360,560);
  if(state==='start'){text('PENALTY',180,230,50,'#3ddc5a','#000');text('SHOOTOUT',180,282,50,'#fff','#000');
   text('Beat the goalkeeper. 5 shots.',180,330,17,'#ddd');text('TAP TO START',180,400,24,'#ffd23f','#000')}
  else{const g=shots.filter(Boolean).length;text(g>=3?'YOU WIN! 🏆':'KEEPER WINS',180,240,38,g>=3?'#3ddc5a':'#ef4444','#000');
   text('Score '+g+' / '+TOT,180,300,28,'#fff');text('TAP TO PLAY AGAIN',180,380,22,'#ffd23f','#000')}
 }
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
